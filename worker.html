<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#6366f1">
<title>صندوق فروش | انباریار</title>
<link rel="manifest" href="/manifest.json">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.0/index.min.css">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<link rel="stylesheet" href="/style-worker.css">
<link rel="stylesheet" href="/style-invoice.css">
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  worker.html - صندوق فروش انباریار
//  ساخته شده با ❤️ توسط آرین
// ============================================================

const $ = (s, p = document) => p.querySelector(s);
const $$ = (s, p = document) => [...p.querySelectorAll(s)];

let state = {
  screen: 'picker',
  worker: null,
  users: [],
  invoice: null,
  html5Qr: null,
  lastScan: { code: '', time: 0 },
  isProcessing: false,
  lastCompleted: null,
  searchTimer: null
};

const fmt = n => (Number(n) || 0).toLocaleString('fa-IR');

function toast(msg, type = '') {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show ' + type;
  setTimeout(() => t.classList.remove('show'), 2500);
}

function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 1800;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.1);
  } catch {}
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json' },
    ...options,
    body: options.body ? JSON.stringify(options.body) : undefined
  });
  return res.json();
}

async function loadUsers() {
  const data = await api('/api/users');
  state.users = (data.users || []).filter(u => u.active);
}

async function loadInvoice() {
  if (!state.worker) return;
  const data = await api('/api/invoice/open?worker=' + encodeURIComponent(state.worker.name));
  if (data.invoice) {
    state.invoice = data.invoice;
  } else {
    const d2 = await api('/api/invoice/start', { method: 'POST', body: { worker: state.worker.name } });
    if (d2.ok) state.invoice = d2.invoice;
  }
}

async function lookupProduct(barcode) {
  const data = await api('/api/products/lookup?barcode=' + encodeURIComponent(barcode));
  return data.product;
}

async function addToInvoice(product, barcode, qty = 1) {
  const data = await api('/api/invoice/add', {
    method: 'POST',
    body: { worker: state.worker.name, barcode, product, qty }
  });
  if (data.ok) {
    state.invoice = data.invoice;
    if (data.warning) toast('⚠️ ' + data.warning, 'error');
  }
  return data;
}

// ============================================================
//  صفحه انتخاب کارمند
// ============================================================
function renderPicker() {
  $('#app').innerHTML = `
    <div class="screen picker active">
      <div class="picker-glow"></div>
      <div class="picker-inner">
        <div class="brand">
          <div class="brand-icon">📦</div>
          <h1>انباریار</h1>
          <p>صندوق فروش هوشمند</p>
        </div>
        <div class="picker-title">کی هستید؟</div>
        <div class="picker-sub">برای شروع، اسم خودتون رو انتخاب کنید</div>
        <div class="workers-grid">
          ${state.users.length ? state.users.map(u => `
            <button class="worker-btn" data-id="${u.id}" style="--worker-color:${u.color || '#6366f1'}">
              <span class="worker-icon">${u.role === 'manager' ? '👔' : '👤'}</span>
              <span class="worker-name">${u.name}</span>
              ${u.role === 'manager' ? '<span class="worker-role">مدیر</span>' : ''}
            </button>
          `).join('') : '<div class="empty-msg">هیچ کارگر فعالی وجود ندارد</div>'}
        </div>
        <div class="footer-sig">✨ ساخته شده با ❤️ توسط آرین</div>
      </div>
    </div>
  `;
  $$('.worker-btn').forEach(btn => {
    btn.onclick = () => {
      const u = state.users.find(x => x.id === btn.dataset.id);
      if (u) selectWorker(u);
    };
  });
}

async function selectWorker(user) {
  state.worker = user;
  localStorage.setItem('anbariyar_worker', user.name);
  state.screen = 'scan';
  await loadInvoice();
  renderScan();
  setTimeout(() => startScanner(), 300);
}

function switchWorker() {
  if (state.invoice?.items?.length) {
    if (!confirm('فاکتور باز دارید. خارج می‌شوید؟')) return;
  }
  stopScanner();
  state.worker = null;
  state.invoice = null;
  localStorage.removeItem('anbariyar_worker');
  state.screen = 'picker';
  renderPicker();
}

// ============================================================
//  صفحه اسکن
// ============================================================
function renderScan() {
  const items = state.invoice?.items || [];
  const total = items.reduce((s, it) => s + it.qty * it.sellPrice, 0);
  $('#app').innerHTML = `
    <div class="screen scan active">
      <header class="scan-header">
        <div class="worker-badge" style="--worker-color:${state.worker?.color || '#6366f1'}">
          <span>${state.worker?.role === 'manager' ? '👔' : '👤'}</span>
          <span>${state.worker?.name || '-'}</span>
        </div>
        <div class="header-actions">
          <button class="icon-btn" id="btn-help">📖</button>
          <button class="icon-btn" id="btn-switch">🔄</button>
        </div>
      </header>
      <div class="scan-info">
        <span class="pulse-dot"></span>
        <span>دوربین فعال است — بارکد را جلوی دوربین بگیرید</span>
      </div>
      <div id="reader" class="reader"></div>
      <div class="last-scan" id="last-scan">
        <div class="last-scan-empty">هنوز چیزی اسکن نشده</div>
      </div>
      <div class="invoice-preview" id="invoice-preview">
        ${items.length ? items.map(it => renderInvoiceItem(it)).join('') : '<div class="empty-msg">فاکتور خالی است</div>'}
      </div>
      ${items.length ? `
        <div class="total-bar">
          <div class="total-info">
            <span class="total-label">جمع کل</span>
            <span class="total-count">${items.length} قلم</span>
          </div>
          <div class="total-value">${fmt(total)} <span>ت</span></div>
        </div>
      ` : ''}
      <div class="scan-actions">
        <button class="action-btn" id="btn-search">🔍<span>جستجو</span></button>
        <button class="action-btn" id="btn-manual">✍️<span>دستی</span></button>
        <button class="action-btn" id="btn-clear" ${items.length ? '' : 'disabled'}>🗑️<span>پاک</span></button>
        <button class="action-btn primary" id="btn-checkout" ${items.length ? '' : 'disabled'}>✅<span>بستن</span></button>
      </div>
    </div>
  `;
  bindScanEvents();
  updateLastScanUI();
}

function renderInvoiceItem(it) {
  return `
    <div class="inv-item" data-id="${it.id}">
      <div class="inv-name">${it.name}</div>
      <div class="inv-controls">
        <button class="qty-btn" data-action="minus">−</button>
        <span class="qty-val">${it.qty}</span>
        <button class="qty-btn" data-action="plus">+</button>
      </div>
      <div class="inv-price">${fmt(it.qty * it.sellPrice)}</div>
      <button class="inv-remove" data-action="remove">×</button>
    </div>
  `;
}

function bindScanEvents() {
  $('#btn-help')?.addEventListener('click', showHelp);
  $('#btn-switch')?.addEventListener('click', switchWorker);
  $('#btn-search')?.addEventListener('click', showSearchModal);
  $('#btn-manual')?.addEventListener('click', showManualModal);
  $('#btn-clear')?.addEventListener('click', clearInvoice);
  $('#btn-checkout')?.addEventListener('click', showCheckoutModal);

  $$('.inv-item').forEach(row => {
    const id = row.dataset.id;
    $$('.qty-btn, .inv-remove', row).forEach(btn => {
      btn.onclick = async () => {
        const action = btn.dataset.action;
        if (action === 'remove') {
          if (!confirm('این کالا از فاکتور حذف شود؟')) return;
          const data = await api('/api/invoice/remove', { method: 'POST', body: { worker: state.worker.name, itemId: id } });
          if (data.ok) { state.invoice = data.invoice; renderScan(); setTimeout(() => startScanner(), 300); }
        } else {
          const delta = action === 'plus' ? 1 : -1;
          const data = await api('/api/invoice/changeQty', { method: 'POST', body: { worker: state.worker.name, itemId: id, delta } });
          if (data.ok) { state.invoice = data.invoice; renderScan(); setTimeout(() => startScanner(), 300); }
        }
      };
    });
  });
}

function updateLastScanUI() {
  const el = $('#last-scan');
  if (!el) return;
  const code = state.lastScan.code;
  if (!code) {
    el.innerHTML = '<div class="last-scan-empty">هنوز چیزی اسکن نشده</div>';
    return;
  }
  const item = state.invoice?.items?.find(it => String(it.barcode) === String(code));
  if (!item) {
    el.innerHTML = '<div class="last-scan-empty">آخرین اسکن: ' + code + '</div>';
    return;
  }
  el.innerHTML = `
    <div class="ls-content">
      <div class="ls-info">
        <div class="ls-name">✅ ${item.name}</div>
        <div class="ls-price">${fmt(item.sellPrice)} تومان</div>
      </div>
      <div class="ls-stock">
        <span class="ls-qty">${item.qty}×</span>
      </div>
    </div>
  `;
}

// ============================================================
//  اسکنر
// ============================================================
async function startScanner() {
  if (state.html5Qr) return;
  const el = $('#reader');
  if (!el) return;
  try {
    el.innerHTML = '';
    state.html5Qr = new Html5Qrcode('reader');
    await state.html5Qr.start(
      { facingMode: 'environment' },
      {
        fps: 10,
        qrbox: (w, h) => {
          const m = Math.min(w, h);
          return { width: Math.floor(m * 0.8), height: Math.floor(m * 0.6) };
        },
        aspectRatio: 1.0,
        disableFlip: false
      },
      onScanSuccess,
      () => {}
    );
  } catch (err) {
    console.error('Scanner error:', err);
    state.html5Qr = null;
  }
}

async function stopScanner() {
  if (state.html5Qr) {
    try { await state.html5Qr.stop(); state.html5Qr.clear(); } catch {}
    state.html5Qr = null;
  }
}
async function onScanSuccess(code) {
  const now = Date.now();
  if (code === state.lastScan.code && now - state.lastScan.time < 3000) return;
  if (state.isProcessing) return;
  
  state.lastScan = { code, time: now };
  state.isProcessing = true;
  beep();
  
  // توقف فوری دوربین
  const scannerRef = state.html5Qr;
  state.html5Qr = null;
  if (scannerRef) {
    try { await scannerRef.stop(); scannerRef.clear(); } catch {}
  }
  
  try {
    const product = await lookupProduct(code);
    if (product) {
      const res = await addToInvoice(product, code);
      if (res.ok) {
        state.invoice = res.invoice;
        state.lastScan = { code, time: Date.now() };
        renderScan();
        setTimeout(() => startScanner(), 500);
        toast('✅ ' + product.name, 'success');
      }
    } else {
      showNewProductModal(code);
    }
  } catch (e) {
    toast('خطا در ارتباط با سرور', 'error');
  } finally {
    state.isProcessing = false;
  }
}

// ============================================================
//  مودال عمومی
// ============================================================
function showModal(content) {
  const m = document.createElement('div');
  m.className = 'modal-backdrop';
  m.innerHTML = `<div class="modal">${content}</div>`;
  document.body.appendChild(m);
  m.onclick = e => { if (e.target === m) closeModal(); };
  return m;
}

function closeModal() {
  const m = $('.modal-backdrop');
  if (m) { m.style.opacity = '0'; setTimeout(() => m.remove(), 200); }
}

// ============================================================
//  راهنما
// ============================================================
function showHelp() {
  showModal(`
    <h3>📖 راهنمای صندوق</h3>
    <div class="help-content">
      <p><b>۱. اسکن بارکد</b><br>کالا را جلوی دوربین بگیرید. اگر پیدا شد، به فاکتور اضافه می‌شود.</p>
      <p><b>۲. کالای جدید</b><br>اگر بارکد پیدا نشد، فرم ثبت کالای جدید باز می‌شود.</p>
      <p><b>۳. جستجو</b><br>اگر بارکد خراب است، با نام کالا جستجو کنید.</p>
      <p><b>۴. ویرایش اقلام</b><br>با دکمه‌های + و − تعداد را تغییر دهید یا کالا را حذف کنید.</p>
      <p><b>۵. بستن فاکتور</b><br>نام مشتری، تلفن، تخفیف و روش پرداخت را وارد کنید.</p>
      <p><b>۶. چاپ و واتساپ</b><br>بعد از ثبت، فاکتور را چاپ یا به واتساپ مشتری بفرستید.</p>
      <hr style="margin:12px 0;border-color:var(--border)">
      <p style="text-align:center;color:var(--text-3);font-size:11px">✨ انباریار نسخه ۳.۰<br>ساخته شده با ❤️ توسط آرین</p>
    </div>
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="closeModal()">فهمیدم ✅</button>
    </div>
  `);
}

// ============================================================
//  جستجو
// ============================================================
function showSearchModal() {
  showModal(`
    <h3>🔍 جستجوی کالا</h3>
    <input type="text" id="search-input" class="modal-input" placeholder="نام کالا را بنویسید..." autofocus>
    <div id="search-results" class="search-results">
      <div class="empty-msg">حداقل ۲ حرف وارد کنید</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">بستن</button>
    </div>
  `);
  const input = $('#search-input');
  input.focus();
  input.oninput = () => {
    clearTimeout(state.searchTimer);
    state.searchTimer = setTimeout(async () => {
      const q = input.value.trim();
      const box = $('#search-results');
      if (q.length < 2) {
        box.innerHTML = '<div class="empty-msg">حداقل ۲ حرف وارد کنید</div>';
        return;
      }
      const data = await api('/api/products/search?q=' + encodeURIComponent(q));
      if (!data.products?.length) {
        box.innerHTML = '<div class="empty-msg">کالایی یافت نشد</div>';
        return;
      }
      box.innerHTML = data.products.map(p => `
        <div class="search-item" data-barcode="${p.barcode}">
          <div class="si-name">${p.name}</div>
          <div class="si-meta">${p.barcode || '—'}</div>
          <div class="si-price">${fmt(p.sellPrice)} تومان · موجودی: ${p.stock}</div>
        </div>
      `).join('');
      $$('.search-item').forEach(it => {
        it.onclick = async () => {
          const bc = it.dataset.barcode;
          closeModal();
          const product = await lookupProduct(bc);
          if (product) {
            const res = await addToInvoice(product, bc);
            if (res.ok) {
              renderScan();
              setTimeout(() => startScanner(), 300);
              toast('✅ ' + product.name, 'success');
            }
          }
        };
      });
    }, 250);
  };
}

// ============================================================
//  ورود دستی
// ============================================================
function showManualModal() {
  showModal(`
    <h3>✍️ ورود دستی بارکد</h3>
    <input type="text" id="manual-input" class="modal-input ltr" placeholder="بارکد را وارد کنید" autofocus>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" id="manual-submit">تأیید</button>
    </div>
  `);
  const input = $('#manual-input');
  input.focus();
  const submit = async () => {
    const code = input.value.trim();
    if (!code) return;
    closeModal();
    await onScanSuccess(code);
  };
  $('#manual-submit').onclick = submit;
  input.onkeypress = e => { if (e.key === 'Enter') submit(); };
}

// ============================================================
//  کالای جدید
// ============================================================
function showNewProductModal(barcode) {
  showModal(`
    <h3>📦 کالای جدید</h3>
    <div class="alert alert-warn">این بارکد در سیستم نیست. اطلاعات کالا را وارد کنید.</div>
    <div class="form-group">
      <label>بارکد</label>
      <input type="text" id="np-barcode" class="modal-input ltr" value="${barcode}" readonly>
    </div>
    <div class="form-group">
      <label>نام کالا *</label>
      <input type="text" id="np-name" class="modal-input" placeholder="مثلاً: شیر پرچرب میهن" autofocus>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>قیمت خرید</label>
        <input type="number" id="np-buy" class="modal-input ltr" placeholder="0">
      </div>
      <div class="form-group">
        <label>قیمت فروش *</label>
        <input type="number" id="np-sell" class="modal-input ltr" placeholder="0">
      </div>
    </div>
    <div class="form-group">
      <label>موجودی اولیه</label>
      <input type="number" id="np-qty" class="modal-input ltr" value="1">
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">رد کردن</button>
      <button class="btn btn-primary" id="np-submit">✅ ثبت و افزودن</button>
    </div>
  `);
  $('#np-name').focus();
  $('#np-submit').onclick = async () => {
    const name = $('#np-name').value.trim();
    const sell = Number($('#np-sell').value) || 0;
    if (!name) return toast('نام کالا الزامی است', 'error');
    if (sell <= 0) return toast('قیمت فروش الزامی است', 'error');
    const res = await api('/api/products/add', {
      method: 'POST',
      body: {
        barcode: $('#np-barcode').value,
        name,
        costPrice: Number($('#np-buy').value) || 0,
        sellPrice: sell,
        stock: Number($('#np-qty').value) || 0
      }
    });
    if (res.ok) {
      closeModal();
      const product = await lookupProduct(barcode);
      if (product) {
        await addToInvoice(product, barcode);
        renderScan();
        setTimeout(() => startScanner(), 300);
        toast('✅ ' + name + ' ثبت و اضافه شد', 'success');
      }
    } else {
      toast('خطا: ' + (res.error || ''), 'error');
    }
  };
}

// ============================================================
//  بستن فاکتور
// ============================================================
function showCheckoutModal() {
  const items = state.invoice?.items || [];
  const subtotal = items.reduce((s, it) => s + it.qty * it.sellPrice, 0);
  showModal(`
    <h3>🧾 بستن فاکتور</h3>
    <div class="form-group">
      <label>نام مشتری (اختیاری)</label>
      <input type="text" id="co-name" class="modal-input" placeholder="آقای احمدی">
    </div>
    <div class="form-group">
      <label>شماره تلفن (برای واتساپ)</label>
      <input type="tel" id="co-phone" class="modal-input ltr" placeholder="09123456789">
    </div>
    <div class="form-group">
      <label>تخفیف (تومان)</label>
      <input type="number" id="co-discount" class="modal-input ltr" placeholder="0">
    </div>
    <div class="form-group">
      <label>روش پرداخت</label>
      <div class="payment-grid">
        <button class="payment-btn active" data-pay="نقدی">💵<span>نقدی</span></button>
        <button class="payment-btn" data-pay="کارتی">💳<span>کارتی</span></button>
        <button class="payment-btn" data-pay="نسیه">📝<span>نسیه</span></button>
      </div>
    </div>
    <div class="checkout-summary">
      <div class="cs-row"><span>جمع اقلام (${items.length}):</span><span id="co-subtotal">${fmt(subtotal)}</span></div>
      <div class="cs-row text-danger"><span>تخفیف:</span><span id="co-discount-show">0</span></div>
      <div class="cs-row total"><span>مبلغ نهایی:</span><span id="co-total">${fmt(subtotal)} تومان</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal()">انصراف</button>
      <button class="btn btn-primary" id="co-submit">✅ ثبت فاکتور</button>
    </div>
  `);
  let payment = 'نقدی';
  $$('.payment-btn').forEach(btn => {
    btn.onclick = () => {
      $$('.payment-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      payment = btn.dataset.pay;
    };
  });
  const updateTotals = () => {
    const d = Number($('#co-discount').value) || 0;
    const final = Math.max(0, subtotal - d);
    $('#co-discount-show').textContent = fmt(d);
    $('#co-total').textContent = fmt(final) + ' تومان';
  };
  $('#co-discount').oninput = updateTotals;
  $('#co-submit').onclick = async () => {
    const res = await api('/api/invoice/close', {
      method: 'POST',
      body: {
        worker: state.worker.name,
        customerName: $('#co-name').value,
        customerPhone: $('#co-phone').value,
        discount: Number($('#co-discount').value) || 0,
        paymentMethod: payment
      }
    });
    if (res.ok) {
      closeModal();
      state.lastCompleted = res.invoice;
      state.invoice = null;
      await loadInvoice();
      renderScan();
      setTimeout(() => startScanner(), 300);
      showSuccessModal(res.invoice);
    } else {
      toast('خطا: ' + (res.error || ''), 'error');
    }
  };
}

  showModal(`

// ============================================================
//  واتساپ
// ============================================================
function sendWhatsApp(inv) {
  let text = `🧾 *فاکتور فروش*\n`;
  text += `شماره: ${inv.invoiceNumber}\n`;
  text += `تاریخ: ${new Date(inv.date).toLocaleDateString('fa-IR')}\n`;
  text += `مشتری: ${inv.customerName}\n\n`;
  text += `📦 اقلام:\n`;
  inv.items.forEach((it, i) => {
    text += `${i + 1}. ${it.name}\n   ${it.qty} × ${fmt(it.sellPrice)} = ${fmt(it.qty * it.sellPrice)} تومان\n`;
  });
  text += `\n💰 جمع: ${fmt(inv.subtotal)} تومان\n`;
  if (inv.discount > 0) text += `🎁 تخفیف: ${fmt(inv.discount)}\n`;
  text += `💵 نهایی: ${fmt(inv.finalPayable)} تومان\n`;
  text += `💳 پرداخت: ${inv.paymentMethod}`;
  let phone = (inv.customerPhone || '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g, '');
  if (phone.startsWith('0')) phone = '98' + phone.slice(1);
  else if (phone && !phone.startsWith('98')) phone = '98' + phone;
  const url = phone
    ? `https://wa.me/${phone}?text=${encodeURIComponent(text)}`
    : `https://wa.me/?text=${encodeURIComponent(text)}`;
  window.open(url, '_blank');
}

function numToWords(n) {
  n = parseInt(n) || 0;
  if (n === 0) return 'صفر تومان';
  const yekan = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
  const dahgan = ['', 'ده', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
  const dahyek = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
  const sadgan = ['', 'یکصد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
  const tabaghat = ['', ' هزار', ' میلیون', ' میلیارد'];
  function cp(num) {
    let s = '', sad = Math.floor(num / 100), dah = Math.floor((num % 100) / 10), yek = num % 10;
    if (sad > 0) s += sadgan[sad];
    if (dah === 1) { if (s) s += ' و '; s += dahyek[yek]; }
    else { if (dah > 0) { if (s) s += ' و '; s += dahgan[dah]; } if (yek > 0) { if (s) s += ' و '; s += yekan[yek]; } }
    return s;
  }
  let parts = [], temp = n, level = 0;
  while (temp > 0) { let chunk = temp % 1000; if (chunk > 0) parts.unshift(cp(chunk) + tabaghat[level]); temp = Math.floor(temp / 1000); level++; }
  return parts.join(' و ') + ' تومان';
}

async function clearInvoice() {
  if (!confirm('تمام اقلام فاکتور حذف شود؟')) return;
  const res = await api('/api/invoice/clear', { method: 'POST', body: { worker: state.worker.name } });
  if (res.ok) {
    state.invoice = res.invoice;
    renderScan();
    setTimeout(() => startScanner(), 300);
    toast('فاکتور خالی شد', 'info');
  }
}
